# Local smoke profile without Docker/Postgres: H2 in-memory.
# Usage: mvn spring-boot:run -Dspring-boot.run.profiles=local
jwt:
  secret: local-dev-only-secret-min-32-chars-000000
spring:
  datasource:
    url: jdbc:h2:mem:northstar-local;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
logging:
  level:
    dev.northstar: DEBUG
