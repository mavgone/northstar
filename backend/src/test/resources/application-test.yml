# Test profile: H2 in-memory, Flyway off, short JWT secret (NOT production).
spring:
  datasource:
    url: jdbc:h2:mem:northstar-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
jwt:
  secret: test-secret-min-32-chars-for-unit-tests-123456
  access-token-expiration: 900000
  refresh-token-expiration: 604800000
  issuer: northstar-notes-test
